[package]
name = "nightfall"
version = "0.2.1"
edition = "2021"
description = "Standalone local sandbox and diagnostics dashboard"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
sysinfo = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
